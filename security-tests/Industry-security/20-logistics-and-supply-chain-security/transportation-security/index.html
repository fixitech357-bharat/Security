<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transportation security | XTutiRaiseUp</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
    min-height:100vh;
    font-family:"Segoe UI",Arial,sans-serif;
    color:#f5f7ff;
    background:
        radial-gradient(circle at 10% 25%,rgba(0,190,255,.12),transparent 35%),
        radial-gradient(circle at 90% 25%,rgba(120,70,255,.14),transparent 35%),
        linear-gradient(120deg,#061b2b,#080d1c 48%,#140f2f);
}
header{
    height:65px;
    padding:0 5%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:rgba(4,8,20,.95);
    border-bottom:1px solid rgba(255,255,255,.08);
}
.brand{
    color:#fff;
    text-decoration:none;
    font-size:21px;
    font-weight:800;
}
nav{display:flex;gap:10px}
.btn{
    color:#f2f5ff;
    text-decoration:none;
    padding:9px 15px;
    border:1px solid rgba(0,190,255,.35);
    border-radius:10px;
    background:rgba(255,255,255,.025);
}
main{
    width:min(1200px,90%);
    margin:auto;
    padding:75px 0;
}
.hero{text-align:center;margin-bottom:40px}
.hero h1{
    font-size:clamp(38px,5vw,65px);
    font-weight:900;
    background:linear-gradient(90deg,#39c6ff,#8274ff,#27d4d5);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}
.hero p{
    max-width:850px;
    margin:18px auto 0;
    color:#b4c0d8;
    line-height:1.7;
}
.grid{
    display:grid;
    grid-template-columns:repeat(4,minmax(0,1fr));
    gap:15px;
}
.card{
    min-height:105px;
    display:block;
    padding:22px;
    text-decoration:none;
    color:#fff;
    background:rgba(255,255,255,.035);
    border:1px solid rgba(255,255,255,.1);
    border-radius:15px;
    transition:.2s ease;
}
.card:hover{
    transform:translateY(-3px);
    border-color:rgba(0,205,255,.4);
    background:rgba(0,180,255,.05);
}
.card strong{
    display:block;
    margin-bottom:8px;
    color:#08d7ff;
    font-size:13px;
}
.card h2{
    font-size:16px;
    line-height:1.4;
}
footer{
    width:min(1200px,90%);
    margin:auto;
    padding:25px 0 35px;
    border-top:1px solid rgba(255,255,255,.07);
    color:#75839e;
    font-size:12px;
    display:flex;
    justify-content:space-between;
}
@media(max-width:1000px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)} footer{flex-direction:column;gap:8px}}
@media(max-width:480px){.grid{grid-template-columns:1fr}header{padding:0 4%}.btn{padding:8px 10px;font-size:12px}}
</style>
</head>

<body>

<header>
    <a class="brand" href="../index.html">XTutiRaiseUp</a>
    <nav>
        <a class="btn" href="../index.html">← Back</a>
    </nav>
</header>

<main>
    <section class="hero">
        <h1>Transportation security</h1>
        <p>Industry-specific cybersecurity domain under Logistics and supply chain security.</p>
    </section>
</main>

<footer>
    <span>XTutiRaiseUp by XSympan Technologies</span>
    <span>Developed with ❤️</span>
</footer>

</body>
</html>
