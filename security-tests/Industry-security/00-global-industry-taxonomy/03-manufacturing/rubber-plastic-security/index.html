<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Rubber Plastic Security | XTutiRaiseUp</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{

    min-height:100vh;

    font-family:
        "Segoe UI",
        Arial,
        sans-serif;

    color:#f5f7ff;

    background:
        radial-gradient(
            circle at 8% 28%,
            rgba(0,190,255,.12),
            transparent 35%
        ),
        radial-gradient(
            circle at 92% 28%,
            rgba(120,70,255,.14),
            transparent 35%
        ),
        linear-gradient(
            120deg,
            #061b2b,
            #080d1c 48%,
            #140f2f
        );
}

header{

    height:65px;

    padding:0 5%;

    display:flex;

    align-items:center;

    justify-content:space-between;

    background:
        rgba(4,8,20,.95);

    border-bottom:
        1px solid rgba(255,255,255,.08);
}

.brand{

    color:white;

    text-decoration:none;

    font-size:21px;

    font-weight:800;
}

.btn{

    color:#f2f5ff;

    text-decoration:none;

    padding:9px 15px;

    border:
        1px solid rgba(0,190,255,.35);

    border-radius:10px;

    background:
        rgba(255,255,255,.025);
}

main{

    width:min(1250px,90%);

    margin:auto;

    padding:75px 0;
}

.hero{

    text-align:center;

    margin-bottom:45px;
}

.hero-label{

    color:#76dfff;

    font-size:14px;

    font-weight:700;

    letter-spacing:1px;

    margin-bottom:10px;
}

h1{

    font-size:
        clamp(40px,5vw,68px);

    font-weight:900;

    background:
        linear-gradient(
            90deg,
            #39c6ff,
            #8274ff,
            #27d4d5
        );

    -webkit-background-clip:text;

    -webkit-text-fill-color:transparent;
}

.hero p{

    max-width:900px;

    margin:18px auto 0;

    color:#b4c0d8;

    font-size:17px;

    line-height:1.7;
}

.grid{

    display:grid;

    grid-template-columns:
        repeat(4,minmax(0,1fr));

    gap:15px;
}

.card{

    display:block;

    min-height:105px;

    padding:21px;

    color:#fff;

    text-decoration:none;

    background:
        rgba(255,255,255,.035);

    border:
        1px solid rgba(255,255,255,.10);

    border-radius:15px;

    transition:.2s ease;
}

.card:hover{

    transform:translateY(-3px);

    border-color:
        rgba(0,205,255,.4);

    background:
        rgba(0,180,255,.05);
}

.card strong{

    display:block;

    margin-bottom:8px;

    color:#08d7ff;

    font-size:13px;
}

.card h2{

    color:#fff;

    font-size:15px;

    line-height:1.4;
}

footer{

    width:min(1250px,90%);

    margin:auto;

    padding:25px 0 35px;

    display:flex;

    justify-content:space-between;

    color:#75839e;

    font-size:12px;

    border-top:
        1px solid rgba(255,255,255,.07);
}

@media(max-width:1000px){

    .grid{
        grid-template-columns:
            repeat(3,1fr);
    }
}

@media(max-width:700px){

    .grid{
        grid-template-columns:
            repeat(2,1fr);
    }

    footer{
        flex-direction:column;
        gap:8px;
    }
}

@media(max-width:480px){

    .grid{
        grid-template-columns:1fr;
    }
}

</style>

</head>

<body>

<header>

<a class="brand" href="../index.html">
    XTutiRaiseUp
</a>

<a class="btn" href="../index.html">
    ← Back
</a>

</header>

<main>

<section class="hero">

<div class="hero-label">
    INDUSTRY CYBERSECURITY
</div>

<h1>
    Rubber Plastic Security
</h1>

<p>
    Industry-specific cybersecurity domain under 03-manufacturing.
</p>

</section>

<section class="grid">



</section>

</main>

<footer>

<span>
    XTutiRaiseUp by XSympan Technologies
</span>

<span>
    Developed with ❤️
</span>

</footer>

</body>

</html>
